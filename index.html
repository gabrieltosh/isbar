<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Isla</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="isla" class="isla">
      <span class="oreja izq"></span>
      <span class="oreja der"></span>

      <!-- Vista compacta (tipo notch) -->
      <div class="compacta">
        <span class="c-izq" id="c-izq"></span>
        <span class="c-centro" id="c-centro"></span>
        <span class="c-der" id="c-der"></span>
      </div>

      <!-- Vista expandida -->
      <div class="expandida">
        <header class="cabecera">
          <div class="titulo" id="titulo"></div>
          <div class="reloj">
            <span class="estado" id="estado"></span>
            <span id="fecha"></span>
            <b id="hora"></b>
          </div>
          <div class="indicador" id="indicador"></div>
        </header>
        <button class="flecha izq" id="anterior" aria-label="Vista anterior"></button>
        <div class="vistas" id="vistas"></div>
        <button class="flecha der" id="siguiente" aria-label="Vista siguiente"></button>
        <div class="puntos" id="puntos"></div>
        <div class="notificacion" id="notificacion"></div>
      </div>
    </div>
  </body>
</html>
