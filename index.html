<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Isla</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- El marco aplica el tamaño elegido en la configuración (--escala) -->
    <div class="marco">
    <div id="isla" class="isla">
      <span class="oreja izq"></span>
      <span class="oreja der"></span>

      <!-- Vista compacta (tipo notch) -->
      <div class="compacta">
        <span class="c-izq" id="c-izq"></span>
        <span class="c-centro" id="c-centro"></span>
        <span class="c-der" id="c-der"></span>
      </div>

      <!-- Vista expandida -->
      <div class="expandida">
        <header class="cabecera">
          <!-- Navegación: un icono por vista activa, fijo arriba porque la isla crece y encoge
               hacia abajo (también se cambia con la rueda; al Calendario se va con la fecha) -->
          <nav class="puntos" id="puntos"></nav>
          <div class="reloj">
            <!-- Campana: solo si hay notificaciones sin descartar; abre el Centro de actividades -->
            <button class="campana" id="campana" title="Notificaciones" aria-label="Notificaciones" hidden></button>
            <!-- Al pulsar la fecha/hora se abre la vista de Calendario -->
            <button class="reloj-fecha" id="reloj" title="Ver calendario">
              <span id="fecha"></span>
              <b id="hora"></b>
            </button>
          </div>
          <div class="cabecera-der">
            <button class="icono-cab engranaje" id="engranaje" aria-label="Configuración" title="Configuración"></button>
          </div>
        </header>
        <!-- Título de la sección actual, en su propia línea bajo la cabecera -->
        <div class="titulo" id="titulo"></div>
        <div class="vistas" id="vistas"></div>
        <div class="notificacion" id="notificacion"></div>
      </div>
    </div>
    </div>
  </body>
</html>
